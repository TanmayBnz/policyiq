name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: this workflow checks code, it never writes to the repository.
permissions:
  contents: read

# A new push to the same branch makes the previous run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what runs locally and in the container; 3.11 is the floor that
        # pyproject.toml promises.
        python: ["3.11", "3.12"]

    services:
      # The same image as docker-compose.yml. Tests run against a real database
      # because the SQL is the part most worth testing.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: policyiq
          POSTGRES_PASSWORD: policyiq
          POSTGRES_DB: policyiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U policyiq -d policyiq"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://policyiq:policyiq@localhost:5432/policyiq
      # Nothing listens here. The tests that need a real model skip, and the unit
      # tests for the model client use a stub transport instead.
      OLLAMA_BASE_URL: http://localhost:11434
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v6

      # Compose applies sql/ through the image's init directory, which a service
      # container cannot mount before checkout. Apply it here instead, in the same
      # filename order the init directory would use.
      - name: Apply database schema
        run: |
          for f in sql/*.sql; do
            PGPASSWORD=policyiq psql -h localhost -U policyiq -d policyiq -v ON_ERROR_STOP=1 -f "$f"
          done

      # The embedding model is ~130 MB from Hugging Face. Caching it keeps runs fast
      # and keeps a registry outage from failing an unrelated pull request.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-BAAI-bge-small-en-v1.5

      # The [dev] extra is required: fpdf2, which generates the specimen policy the
      # tests use in place of the non-redistributable corpus, is declared there.
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check src tests

      # -rs lists every skip with its reason, so a test that has quietly stopped
      # running is visible in the log rather than hidden in a count.
      - name: Test
        run: .venv/bin/python -m pytest -q -rs

  image:
    name: container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t policyiq:ci .
