services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: policyiq
      POSTGRES_PASSWORD: policyiq
      POSTGRES_DB: policyiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policyiq -d policyiq"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # Lets the container reach Ollama running on the host. Required on Linux;
    # Docker Desktop provides it automatically.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
